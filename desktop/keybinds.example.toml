# OriginOS keybind schema (draft — yours to finalize).
# One file, one schema, every desktop honors it. Format:
#   action = "key combination"
#
# Modifiers: ctrl, alt, shift, super. Join with +. Single canonical form:
# modifiers sorted alphabetically, lowercase, e.g. "alt+ctrl+t".

[keys]
