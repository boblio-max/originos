# OriginOS kernel config fragment.
# Each uncommented line OVERRIDES the Debian default when merged.
# Research every option before enabling it — a wrong value here
# builds a kernel that boots nowhere. Commented = untouched default.

# --- examples (all disabled until you decide) ---
# Faster desktop preemption:
# CONFIG_PREEMPT=y

# Your hardware driver built-in instead of a module:
# CONFIG_XXX=y

# Something you know you will never need, compiled out:
# CONFIG_YYY=n
